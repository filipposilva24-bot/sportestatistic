<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Estatísticas de Futebol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-emerald-400">📊 Painel Analítico & Mercados de Elite</h1>
      <p class="text-sm text-gray-400 mt-1">Médias de Gols, Finalizações, Chutes no Gol, Escanteios e Cartões (Últimos 5 Jogos)</p>
    </header>

    <div id="painel-estatisticas" class="space-y-6">
      <p class="text-center text-gray-500 animate-pulse">Carregando dados analíticos das partidas...</p>
    </div>
  </div>

  <script>
    function renderFormaBadges(formaArray) {
      return formaArray.map(res => {
        let bg = "bg-gray-700 text-white";
        if (res === 'V') bg = "bg-emerald-600 text-white font-bold";
        else if (res === 'E') bg = "bg-amber-600 text-white font-bold";
        else if (res === 'D') bg = "bg-rose-600 text-white font-bold";
        return `<span class="w-5 h-5 flex items-center justify-center rounded text-[10px] ${bg}">${res}</span>`;
      }).join('');
    }

    async function carregarEstatisticas() {
      const container = document.getElementById('painel-estatisticas');

      try {
        const response = await fetch('/api/estatisticas');
        const data = await response.json();

        if (!data.success || !data.matches || data.matches.length === 0) {
          container.innerHTML = `<p class="text-center text-gray-400">${data.message || 'Nenhuma estatística encontrada para hoje.'}</p>`;
          return;
        }

        let htmlGeral = '';
        const jogosPorPais = {};

        data.matches.forEach(jogo => {
          const pais = jogo.country || "Internacional";
          const liga = jogo.league || "Outras Ligas";

          if (!jogosPorPais[pais]) jogosPorPais[pais] = {};
          if (!jogosPorPais[pais][liga]) jogosPorPais[pais][liga] = [];

          jogosPorPais[pais][liga].push(jogo);
        });

        for (const [pais, ligas] of Object.entries(jogosPorPais)) {
          htmlGeral += `
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-5 shadow-xl">
              <h2 class="text-xl font-bold text-emerald-400 mb-4 flex items-center gap-2">
                🌍 ${pais}
              </h2>`;

          for (const [liga, partidas] of Object.entries(ligas)) {
            htmlGeral += `
              <div class="mb-4 last:mb-0">
                <h3 class="text-md font-semibold text-gray-300 mb-3 border-b border-gray-800 pb-1">
                  🏆 ${liga}
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

            partidas.forEach(p => {
              const dataFormatada = new Date(p.matchDate).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
              const u5 = p.ultimos5Jogos || { home: {}, away: {} };
              
              htmlGeral += `
                <div class="bg-gray-900 border border-gray-800/80 rounded-xl p-4 hover:border-emerald-500/40 transition-all shadow-md">
                  <div class="flex justify-between items-center text-xs text-gray-400 mb-2">
                    <span class="bg-gray-800 px-2 py-0.5 rounded text-gray-300">📅 ${dataFormatada}</span>
                    <span class="text-emerald-400 font-medium">${p.statusPartida || 'Agendado'}</span>
                  </div>
                  
                  <div class="text-center font-bold text-white text-base my-2">
                    ${p.homeTeam} <span class="text-gray-500 font-normal mx-1">vs</span> ${p.awayTeam}
                  </div>

                  <!-- Comparativo Estatístico Detalhado (Últimos 5 Jogos) -->
                  <div class="grid grid-cols-2 gap-2 my-3 text-xs">
                    <!-- Mandante -->
                    <div class="bg-gray-950/70 p-2.5 rounded-lg border border-gray-800 space-y-2">
                      <div class="flex justify-between items-center border-b border-gray-800 pb-1">
                        <span class="text-emerald-400 font-semibold truncate max-w-[110px]" title="${p.homeTeam}">🏠 ${p.homeTeam}</span>
                        <div class="flex gap-1">${renderFormaBadges(u5.home.forma || ['V','E','V','D','V'])}</div>
                      </div>
                      <div class="text-gray-300 space-y-1">
                        <div class="flex justify-between"><span>⚽ Gols:</span> <strong class="text-emerald-400">${u5.home.mediaGols}</strong></div>
                        <div class="flex justify-between"><span>🎯 Finalizações:</span> <strong class="text-white">${u5.home.mediaFinalizacoes}</strong></div>
                        <div class="flex justify-between"><span>🥅 Chutes no Gol:</span> <strong class="text-white">${u5.home.mediaChutesNoGol}</strong></div>
                        <div class="flex justify-between"><span>🚩 Escanteios:</span> <strong class="text-white">${u5.home.mediaEscanteios}</strong></div>
                        <div class="flex justify-between"><span>🟨 Cartões:</span> <strong class="text-white">${u5.home.mediaCartoes}</strong></div>
                      </div>
                    </div>

                    <!-- Visitante -->
                    <div class="bg-gray-950/70 p-2.5 rounded-lg border border-gray-800 space-y-2">
                      <div class="flex justify-between items-center border-b border-gray-800 pb-1">
                        <span class="text-blue-400 font-semibold truncate max-w-[110px]" title="${p.awayTeam}">✈️ ${p.awayTeam}</span>
                        <div class="flex gap-1">${renderFormaBadges(u5.away.forma || ['D','V','E','V','D'])}</div>
                      </div>
                      <div class="text-gray-300 space-y-1">
                        <div class="flex justify-between"><span>⚽ Gols:</span> <strong class="text-emerald-400">${u5.away.mediaGols}</strong></div>
                        <div class="flex justify-between"><span>🎯 Finalizações:</span> <strong class="text-white">${u5.away.mediaFinalizacoes}</strong></div>
                        <div class="flex justify-between"><span>🥅 Chutes no Gol:</span> <strong class="text-white">${u5.away.mediaChutesNoGol}</strong></div>
                        <div class="flex justify-between"><span>🚩 Escanteios:</span> <strong class="text-white">${u5.away.mediaEscanteios}</strong></div>
                        <div class="flex justify-between"><span>🟨 Cartões:</span> <strong class="text-white">${u5.away.mediaCartoes}</strong></div>
                      </div>
                    </div>
                  </div>
                  
                  <div class="text-xs text-gray-400 pt-2 border-t border-gray-800/80 flex justify-between items-center">
                    <span>⚖️ Árbitro: <strong class="text-gray-300">${p.arbitro}</strong></span>
                    <span class="text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-900/50 font-medium">
                      Pronto para Análise
                    </span>
                  </div>
                </div>
              `;
            });

            htmlGeral += `</div></div>`;
          }
          htmlGeral += `</div>`;
        }

        container.innerHTML = htmlGeral;

      } catch (error) {
        console.error("Erro ao carregar painel:", error);
        container.innerHTML = '<p class="text-center text-red-400">Erro ao carregar dados estatísticos.</p>';
      }
    }

    carregarEstatisticas();
  </script>

</body>
</html>
